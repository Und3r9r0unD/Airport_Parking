name: Deploy with Secret Key

on:
  push:
    branches:
      - main

# GitHub Pages 배포에 필요한 필수 권한 명시
permissions:
  contents: read
  pages: write
  id-token: write

# 중복 실행 방지
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Secret 키 주입 (구분자로 '#' 사용하여 특수문자 충돌 방지)
      - name: Inject API Key
        run: |
          sed -i 's#__API_KEY__#${{ secrets.GIMPO_API_KEY }}#g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
